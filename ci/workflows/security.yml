name: Security

on:
  push:
    branches: [main, jarvis-migration]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret and personal-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the exposure lives in old commits

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Working-tree scan (blocking)
        run: python scripts/verify_repository_sanitization.py

      - name: History scan (informational until history is cleaned)
        # Non-blocking on purpose: history still contains known exposures that
        # require owner-authorized rewriting. Flip to blocking once cleaned -
        # see security/history-rewrite-plan.md.
        continue-on-error: true
        run: python scripts/verify_repository_sanitization.py --history --json

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc || true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3

  catalog-drift:
    name: Agent catalog drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generated agent definitions must match the canonical catalog
        run: python scripts/compile_agent_catalog.py --check
