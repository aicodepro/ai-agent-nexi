name: CI - Windows

# Nexi is a Windows desktop assistant. This lane runs the tests that genuinely
# need Windows APIs (SAPI, pywin32, UI Automation) and a real browser.

on:
  push:
    branches: [main, jarvis-migration]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Windows runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[windows,browser,vision,test]"

      - name: Install Chromium for browser tests
        run: python -m playwright install chromium

      - name: Compile all source
        run: python -m compileall -q engine main.py run.py

      - name: Test collection must not error
        run: python -m pytest --collect-only -q

      - name: Full suite
        # No audio marker: GitHub runners have no microphone. Physical wake-word
        # testing is BLOCKED_EXTERNAL_HARDWARE and is not faked here.
        run: |
          python -m pytest -q -rf --tb=short -m "not audio" --junitxml=windows-results.xml
        env:
          # Never start the camera auth gate in CI.
          FACE_RECOGNITION_ON_STARTUP: "false"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results-py${{ matrix.python-version }}
          path: windows-results.xml
