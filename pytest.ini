[pytest]
# Collect only the real suite. Without this, a bare `pytest` also scans
# scripts/, where diagnostic helpers named test_*.py do runtime work at import
# time (scripts/test_pipeline_startup.py calls sys.exit(1) when openwakeword is
# missing), which aborts collection instead of failing/skipping a test.
testpaths = tests

# Diagnostics live in scripts/ and are run by hand, not by pytest.
norecursedirs =
    scripts
    archive
    agent
    datasets
    node_modules
    .venv
    external
    hey_nexi_clips
    www_mark
    .git

markers =
    windows: requires Windows-only APIs (UI Automation, SAPI, pywin32)
    audio: requires a real microphone or audio device
    browser: requires a real browser / Playwright Chromium
    integration: talks to live external services
