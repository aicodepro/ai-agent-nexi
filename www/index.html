<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis</title>

    <link rel="shortcut icon" href="assets/img/logo.ico" type="image/x-icon">

    <!-- Bootsrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <!-- Bootsrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Particle js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
        type="text/javascript"></script>

    <!-- Texllate  -->
    <link rel="stylesheet" href="assets/vendore/texllate/animate.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">



        <section id="Oval" class="mb-4">

            <div class="row">
                <div class="col-md-1"></div>
                <div class="col-md-10">
                    <div class="d-flex justify-content-center align-items-center" style="height: 80vh;">

                        <canvas id="canvasOne" width="700" height="420" style="position: absolute;"></canvas>

                        <div id="JarvisHood" class="jarvis-state-idle">

                            <div class="square">
                                <span class="circle"></span>
                                <span class="circle"></span>
                                <span class="circle"></span>
                                <div id="JarvisOrbCore" class="jarvis-orb-core"></div>
                            </div>

                        </div>

                    </div>
                    <div id="StatusLabel" class="text-light text-center status-label">Say Hey Jarvis or double clap</div>
                    <div id="SourceBadge" class="source-badge">Idle</div>
                    <div id="ContextIndicator" class="context-indicator hidden"><span></span>Context Active</div>
                    <div id="TranscriptPreview" class="transcript-preview">Waiting for wake word...</div>
                    <div id="TranscriptCard" class="transcript-card" aria-live="polite">
                        <div><span class="entry-label">YOU</span> <span id="UserText"></span></div>
                        <div><span class="entry-label">JARVIS</span> <span id="JarvisText"></span></div>
                        <div id="ResponseMeta" class="entry-meta"></div>
                    </div>
                    <div id="presence-panel" class="presence-panel" aria-live="polite">
                        <span id="PresenceAttention">NONE</span>
                        <span id="PresenceGoal">WAITING FOR WAKE WORD</span>
                        <span id="PresenceConfidence">0%</span>
                    </div>
                    <div id="diagnostics-dashboard" class="diagnostics-dashboard hidden">
                        <div id="dashboard-summary">Dashboard unavailable</div>
                        <div id="dashboard-panels"></div>
                    </div>
                    <div id="WaveformBars" class="waveform-bars" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="col-md-12 mt-4 pt-4">
                        <div class="text-center">
                            <div id="TextInput" class="d-flex">

                                <input type="text" class="input-field" name="chatbox" id="chatbox"
                                    placeholder="type here ... ">
                                <button id="SendBtn" class="glow-on-hover" hidden><i class="bi bi-send"></i></button>
                                <button id="MicBtn" class="glow-on-hover"><i class="bi bi-mic"></i></button>
                                <button id="SleepWakeBtn" class="glow-on-hover" title="Sleep or wake Jarvis"><i class="bi bi-power"></i></button>
                                <button id="ChatBtn" class="glow-on-hover" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" aria-controls="offcanvasScrolling"><i class="bi bi-chat-dots"></i></button>
                                <button id="SettingsBtn" class="glow-on-hover"><i class="bi bi-gear"></i></button>

                            </div>
                        </div>
                    </div>

                    <div id="SpeechCapsule" class="speech-capsule hidden" aria-live="polite"></div>

                </div>
                <div class="col-md-1"></div>
            </div>

        </section>

        <section id="SiriWave" class="mb-4" hidden>

            <div class="container">
                <div class="row">
                    <div class="col-md-12">
                        <div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
                            <div class="">
                                <p class="text-start text-light mb-4 siri-message" style="font-size: 28px;">Hello, I am J.A.R.V.I.S</p>
                                <div id="siri-container"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </section>
    </div>

    <div class="offcanvas offcanvas-start chat-canvas" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1"
        id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title text-white" id="offcanvasScrollingLabel">Chats</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div id="chat-canvas-body" class="offcanvas-body">
            <!-- Chatting code here -->

        </div>
    </div>

    <section id="JarvisOutputWorkspace" class="jarvis-output-workspace hidden" aria-label="Jarvis Output Workspace">
        <div id="OutputWorkspaceHeader" class="workspace-header">
            <div>
                <div class="workspace-title">Jarvis Output Workspace</div>
                <span id="OutputWorkspaceType" class="workspace-type">Text</span>
                <span id="OutputWorkspaceStatus" class="workspace-status">Ready</span>
            </div>
            <div class="workspace-window-actions">
                <button id="OutputMinimizeBtn" type="button">_</button>
                <button id="OutputPinBtn" type="button">pin</button>
                <button id="OutputCloseBtn" type="button">x</button>
            </div>
        </div>
        <div class="workspace-body">
            <div id="OutputWorkspaceSummary" class="workspace-summary"></div>
            <div id="OutputWorkspaceContent" class="workspace-content"></div>
        </div>
        <div class="workspace-footer">
            <button id="WorkspaceCopyBtn" type="button">Copy</button>
            <button id="WorkspaceCreateFileBtn" type="button">Create File</button>
            <button id="WorkspaceSaveMdBtn" type="button">Save .md</button>
            <button id="WorkspaceSaveTxtBtn" type="button">Save .txt</button>
            <button id="WorkspaceReadSummaryBtn" type="button">Read Summary</button>
            <button id="WorkspaceShorterBtn" type="button">Make Shorter</button>
            <button id="WorkspaceRegenerateBtn" type="button">Regenerate</button>
        </div>
    </section>

    <!--Jquery  -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Particle js -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>
    <script src='https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js'></script>
    <script src="script.js"></script>

    <!-- Siri wave -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

    <!-- Texllate js -->
    <script src="assets/vendore/texllate/jquery.fittext.js"></script>
    <script src="assets/vendore/texllate/jquery.lettering.js"></script>
    <script src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

    <script src="/eel.js"></script>
    <script src="main.js"></script>
    <script src="controller.js"></script>


</body>

</html>
